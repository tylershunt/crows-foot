[package]
name = "crows-foot"
version = "0.5.0"
description = "A local dashboard that groups the GitHub pull requests needing your attention into configurable sections."
authors = ["Tyler Hunt"]
license = "MIT"
repository = "https://github.com/tylershunt/crows-foot"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crows_foot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "rt", "sync"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
